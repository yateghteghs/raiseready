# Supabase CLI configuration for local development (`supabase start`).
# Settings not listed here use the CLI defaults.
project_id = "raiseready"

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_confirmations = true

[storage]
file_size_limit = "20MiB"
